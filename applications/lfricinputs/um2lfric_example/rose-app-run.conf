[command]
default=$CORE_ROOT_DIR/bin/tweak_iodef; \
       =$LAUNCH_SCRIPT/launch-exe

[env]
CORES_PER_NODE=${CORES_PER_NODE}
ENSEMBLE_MEMBER=0
EXEC_NAME=${APP_NAME}
EXTRA_NAMELIST_FILES=um.ctl lfric.nl io.nl
HYPERTHREADS=${HYPERTHREADS}
NUMA_REGIONS_PER_NODE=${NUMA_REGIONS_PER_NODE}
OMP_NUM_THREADS=${OMP_NUM_THREADS}
RUN_METHOD=${RUN_METHOD}
TARGET_PLATFORM=${TARGET_PLATFORM}
TOTAL_RANKS=${TOTAL_RANKS}
XIOS_SERVER_MODE=${XIOS_SERVER_MODE}
XIOS_SERVER_RANKS=${XIOS_SERVER_RANKS}

[file:input_mesh_faces.nc]
source=$LFRIC_MESH_FILE

[file:io.nl]
source=namelist:iofiles

[file:iodef.xml]
source=$ROSE_SUITE_DIR/app/um2lfric/file/iodef_basicgal_stash_list.xml

[file:lfric.nl]
source=namelist:base_mesh namelist:extrusion namelist:finite_element
      =namelist:planet
      =namelist:partitioning
      =namelist:formulation
      =namelist:io
      =namelist:time
      =namelist:timestepping
      =namelist:logging

[file:um.ctl]
source=namelist:configure_um2lfric namelist:regrid_options

[file:weights_file_p_to_face_centre_bilinear.nc]
source=$WEIGHT_LOC/P_to_FACE_CENTRE_bilinear.nc

[file:weights_file_p_to_face_centre_neareststod.nc]
source=$WEIGHT_LOC/P_to_FACE_CENTRE_neareststod.nc

[file:weights_file_u_to_face_centre_bilinear.nc]
source=$WEIGHT_LOC/U_to_FACE_CENTRE_bilinear.nc

[file:weights_file_v_to_face_centre_bilinear.nc]
source=$WEIGHT_LOC/V_to_FACE_CENTRE_bilinear.nc

[namelist:base_mesh]
f_lat_deg=45.0
file_prefix='input_mesh_faces'
fplane=.false.
geometry='spherical'
prepartitioned=.false.
prime_mesh_name='$LFRIC_MESH_NAME'
topology='fully_periodic'

[namelist:configure_um2lfric]
l_land_area_fraction=.true.
num_snow_layers=3
num_surface_types=9
stash_list=2,3,150,4,389,391,392,393,394,265,266,267,268,25,26,493,240,
          =380,376,231,221,242,377,383,382,386,381,384,9,20,279,278,
          =281,213,229,233,508,49
stashmaster_file='$UMDIR/vn13.7/ctldata/STASHmaster/STASHmaster_A'
um_file='$SOURCE_DUMP'
weights_file_p_to_face_centre_bilinear='weights_file_p_to_face_centre_bilinear.nc'
weights_file_p_to_face_centre_neareststod='weights_file_p_to_face_centre_neareststod.nc'
weights_file_u_to_face_centre_bilinear='weights_file_u_to_face_centre_bilinear.nc'
weights_file_v_to_face_centre_bilinear='weights_file_v_to_face_centre_bilinear.nc'

[namelist:extrusion]
domain_height=80000.0
method='um_L70_50t_20s_80km'
number_of_layers=$NUMBER_OF_LAYERS
planet_radius=6371229.0

[namelist:files]
checkpoint_stem_name='$CHECKPOINT_STEM_FILE'

[namelist:finite_element]
cellshape='quadrilateral'
coord_order=1
coord_order_nonprime=1
coord_space='Wchi'
coord_system='native'
element_order_h=0
element_order_v=0
rehabilitate=.true.
vorticity_in_w1=.true.

[namelist:formulation]
l_multigrid=.false.
use_multires_coupling=.false.
use_physics=.true.

[namelist:io]
checkpoint_read=${RESTART_READ}
checkpoint_write=${RESTART_WRITE}
counter_output_suffix='counter.txt'
diagnostic_frequency=1
file_convention='UGRID'
nodal_output_on_w3=${NODAL_OUTPUT_ON_W3}
subroutine_counters=.false.
subroutine_timers=.false.
timer_output_path='timer.txt'
use_xios_io=${USE_XIOS_IO}
write_diag=.false.

[namelist:iofiles]
ancil_file_map='land_area_ancil : $BIG_DATA_DIR/ancils/basic-gal/Quagga/$TARGET_GRID_RES/n96e_l70/orca025/land_sea_mask/qrparm.landfrac.ugrid'
ancil_read=.true.
checkpoint_read=.false.
checkpoint_write=.true.
checkpoint_write_file='checkpoint_um2lfric_000001'

[namelist:logging]
run_log_level='${LOG_LEVEL}'

[namelist:partitioning]
generate_inner_halos=.true.
panel_decomposition='${PANEL_DECOMP}'
panel_xproc=${XPROC}
panel_yproc=${YPROC}
partitioner='cubedsphere'

[namelist:planet]
cp=1005.0
gravity=9.80665
omega=7.292116E-5
p_zero=100000.0
rd=287.05
scaling_factor=125.0

[namelist:regrid_options]
interp_method='bilinear'
regrid_type='global_to_global'
specify_nearest_neighbour=240,380,376,231,221,242,377,383,382,386,381,384
winds_on_w3=.true.

[namelist:time]
calendar='timestep'
calendar_origin='2016-01-01 15:00:00'
calendar_start='2016-01-01 15:00:00'
calendar_type='gregorian'
timestep_end='${RESTART_STOP}'
timestep_start='${RESTART_START}'

[namelist:timestepping]
dt=1.0
!!spinup_period=0.0
